name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are current
        run: pnpm gen:api && git diff --exit-code lib/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end · API + web + Playwright
    runs-on: ubuntu-latest
    env:
      CRICIQ_DATA_DIR: ${{ github.workspace }}/.e2e-data
      CRICIQ_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Build a serving database from the fixture matches
        run: |
          mkdir -p "$RUNNER_TEMP/cricsheet"
          (cd tests/fixtures/cricsheet/matches && zip -q "$RUNNER_TEMP/cricsheet/ipl_json.zip" *.json)
          uv run criciq-data snapshot "$RUNNER_TEMP/cricsheet/ipl_json.zip" tests/fixtures/cricsheet/people.csv
          uv run criciq-data run --no-download --report "$RUNNER_TEMP/report.md"
          uv run criciq-ml score
      - name: Start the API
        run: |
          # Run the venv binary directly: a long-lived `uv run` holds uv's cache lock
          # and would block the cache-save step at the end of the job.
          .venv/bin/uvicorn criciq_api.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:8000/healthz; do sleep 1; done'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build and start the web app
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm start --port 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:3000 > /dev/null; do sleep 1; done'
      - name: Run Playwright
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Upload traces and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            frontend/test-results
            ${{ runner.temp }}/*.log

  docker:
    name: API image · builds and validates live data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (downloads Cricsheet, validates, exports)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          load: true
          tags: criciq-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container
        run: |
          docker run -d --name api -p 10000:10000 criciq-api:ci
          timeout 90 sh -c 'until curl -sf http://127.0.0.1:10000/healthz; do sleep 2; done'
          curl -sf "http://127.0.0.1:10000/api/v2/ipl/matches/1181768/timeline"             | python3 -c "import json,sys; t=json.load(sys.stdin); print(t['win_probability']['version'], t['deliveries'][-1]['wp'])"
          curl -sf http://127.0.0.1:10000/api/v2/ipl/meta | python3 -c "import json,sys; m=json.load(sys.stdin); print(m['data_version'], len(m['seasons']), 'seasons')"
          curl -sf "http://127.0.0.1:10000/api/v2/ipl/players/ba607b88" | python3 -c "import json,sys; p=json.load(sys.stdin); print(p['player']['name'], p['batting']['runs'], 'runs, WPA', p['batting']['wpa'])"
          curl -sf "http://127.0.0.1:10000/api/v2/ipl/matchups/ba607b88/462411b3" | python3 -c "import json,sys; m=json.load(sys.stdin); print(m['head_to_head']['balls'], 'balls, estimate SR', m['estimate']['strike_rate']['value'])"
          curl -sf "http://127.0.0.1:10000/api/v2/ipl/players/462411b3" | python3 -c "import json,sys; r=json.load(sys.stdin)['ratings']['bowling']['items'][0]; print(r['label'], r['rating'], (r['low'], r['high']))"
          curl -sf "http://127.0.0.1:10000/api/v2/ipl/matches/1181768/timeline" | python3 -c "import json,sys; d=[x for x in json.load(sys.stdin)['deliveries'] if x['innings_no'] == 2][-2]; print('pressure', d['pressure'], 'leverage', d['leverage'], 'momentum', d['momentum'])"
          curl -sf "http://127.0.0.1:10000/api/v2/ipl/players/462411b3/similar" | python3 -c "import json,sys; s=json.load(sys.stdin)['bowling']; print('similar:', [p['name'] for p in s['items']])"
          curl -sf "http://127.0.0.1:10000/api/v2/ipl/teams/standings/2019" | python3 -c "import json,sys; t=json.load(sys.stdin)['rows']; print('2019 table:', [(r['team']['franchise_id'], r['points'], r['nrr']) for r in t[:4]])"
          curl -sf -X POST "http://127.0.0.1:10000/api/v2/ipl/simulate/state" -H 'content-type: application/json' -d '{"match_id": 1181768, "innings_no": 2, "seq_no": 100, "runs": 120}' | python3 -c "import json,sys; s=json.load(sys.stdin); print('what-if', s['model_win_pct'], '->', s['whatif_win_pct'], 'in', s['seconds'], 's')"
          curl -sf "http://127.0.0.1:10000/api/v2/ipl/teams/h2h?a=MI&b=CSK" | python3 -c "import json,sys; h=json.load(sys.stdin); print('MI v CSK', h['record']['a_won'], '-', h['record']['b_won'], 'expected', h['expectation']['a_expected'])"
