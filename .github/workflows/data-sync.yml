name: Data sync

# Brings the data up to date from Cricsheet every six hours and redeploys the API
# with it. Written in V2-1 and kept off until the v2.0 launch (V2-8): it runs only
# when started by hand AND the repository variable CRICIQ_SYNC_ENABLED is "true".
# At launch, uncomment the schedule and set the variable and the secrets below.
#
# Secrets: RENDER_DEPLOY_HOOK_URL (Render service > Settings > Deploy Hook),
# VERCEL_TOKEN and VERCEL_PROJECT_ID (to invalidate the web app's cache tag).

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "15 */6 * * *"

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.CRICIQ_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --locked

      # The ingest log and the current data carry over between runs, so each
      # sync only fetches Cricsheet's recent additions.
      - name: Restore the data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: criciq-data-${{ github.run_id }}
          restore-keys: criciq-data-

      - name: First run builds everything
        if: hashFiles('data/sync/ingest.duckdb') == ''
        run: |
          uv run criciq-data run --report "$RUNNER_TEMP/data-quality-report.md"
          uv run criciq-ml score

      - name: Sync
        id: sync
        run: |
          uv run criciq-data sync | tee "$RUNNER_TEMP/sync.log"
          if grep -q "up to date" "$RUNNER_TEMP/sync.log"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          uv run criciq-data sync-status | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: criciq-data-${{ github.run_id }}

      - name: Publish the serving database
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: serving-duckdb
          path: data/exports/serving.duckdb
          retention-days: 7

      - name: Redeploy the API
        if: steps.sync.outputs.changed == 'true'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Refresh the web app's cached API data
        if: steps.sync.outputs.changed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v1/edge-cache/invalidate-by-tags?projectIdOrName=${{ secrets.VERCEL_PROJECT_ID }}" \
            -d '{"tags": ["criciq-api", "_N_T_/layout"], "target": "production"}'

      - name: Report quarantined matches
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "quarantined [0-9]" "$RUNNER_TEMP/sync.log"; then
            gh issue create --title "Data sync quarantined matches ($(date -u +%F))" \
              --body "$(grep 'quarantined ' "$RUNNER_TEMP/sync.log")"
          fi
