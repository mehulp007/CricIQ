[project]
name = "criciq-api"
version = "0.1.0"
description = "CricIQ FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "criciq-core",
    "duckdb>=1.2",
    "fastapi>=0.115",
    "pydantic-settings>=2.8",
    "uvicorn[standard]>=0.34",
]

[tool.uv.sources]
criciq-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
