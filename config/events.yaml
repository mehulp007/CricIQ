  - { competition: TEST, series: [AUS, ENG], year: 2023, matches: 5, wins: { ENG: 2, AUS: 2 }, drawn: 1 }
  - { competition: TEST, series: [AUS, IND], year: 2018, matches: 4, wins: { IND: 2, AUS: 1 }, drawn: 1 }
  - { competition: TEST, series: [AUS, ENG], year: 2019, matches: 5, wins: { AUS: 2, ENG: 2 }, drawn: 1 }
  - { competition: TEST, series: [AUS, IND], year: 2020, matches: 4, wins: { IND: 2, AUS: 1 }, drawn: 1 }
  - { competition: TEST, series: [AUS, ENG], year: 2021, matches: 5, wins: { AUS: 4 }, drawn: 1 }
