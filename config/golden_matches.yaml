# exactly. They cover a normal match, finals, a rain-reduced (DLS) chase, a
# super-over tie and an Impact Player era match. Validation fails on any mismatch.
#
# Totals are innings runs/wickets; wickets count dismissals only
# (retired hurt is not a wicket).

