# CricIQ Ratings: fitting configuration.
#
# Ratings have no model to train, but each component needs a shrinkage
# constant k: how many balls (or innings) of an average qualified player's
# record are blended into a player's own. k is tuned so a player's shrunk
# record in one season best predicts their next season, and the protocol is
# tested once on later seasons, as for the models.

name: ratings
version: 2.0.0

# v2 fits every scope of the players database (each T20 competition, and all T20
# together) on its own records. v1 (1.0.0) was fitted on the IPL alone.
source: players
# A competition with fewer players followed from one season to the next than
# this borrows the all-T20 k (and stability) for that component.
min_pairs: 100

splits:
  # k for the validation is tuned on seasons before this one; predictions of
  # each next season from 2022->2023 onward are then scored.
  test_from: 2023

# Candidate values of k, log-spaced between these bounds (in exposure units).
k_grid:
  low: 1
  high: 20000
  points: 161

# A single season is a short window: players qualify for the tuning and the
# stability check with this share of the window thresholds (150 balls in the
# role instead of 300, 60 balls in a phase instead of 120, 5 innings).
season_factor: 0.5

# Stability labels from the year-to-year correlation of single-season
# ratings. "low" components are shown with a warning that a season's rating
# is mostly luck.
stability:
  high: 0.3
  moderate: 0.15

# Similar players: the retrieval test needs this many balls in both seasons.
style_min_balls: 150
