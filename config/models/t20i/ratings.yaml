# CricIQ Ratings for men's T20 internationals: fitting configuration.
#
# Fitted on T20I records alone (the T20I scope of the players database), as in
# ../ratings.yaml. With one competition there is nothing to borrow from: every
# component keeps its own k and stability.

name: ratings
version: 1.0.0
source: players
min_pairs: 100

splits:
  # k for the validation is tuned on seasons before this one; predictions of
  # each next season from 2022->2023 onward are then scored.
  test_from: 2023

# Candidate values of k, log-spaced between these bounds (in exposure units).
k_grid:
  low: 1
  high: 20000
  points: 161

# Players qualify for the tuning and the stability check with this share of the
# window thresholds (see ../ratings.yaml).
season_factor: 0.5

stability:
  high: 0.3
  moderate: 0.15

# Similar players: the retrieval test needs this many balls in both seasons.
style_min_balls: 150
