# CricIQ Ratings for Tests: fitting configuration.
#
# The same components and protocol as the limited-overs ratings (../ratings.yaml),
# fitted on the Test scope of the players database. Par is the Test rate for the
# year and phase (the new ball, the middle overs, the second new ball), so a Test
# batter is judged against Test batting, not against T20 scoring.

name: ratings
version: 1.0.0

source: players
min_pairs: 100

splits:
  test_from: 2023

k_grid:
  low: 1
  high: 20000
  points: 161

season_factor: 0.5

stability:
  high: 0.3
  moderate: 0.15

style_min_balls: 150
