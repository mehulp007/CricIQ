# Names that several grounds share, told apart by Cricsheet's city: name -> city ->
# ground (`id`, plus `name` and `country` where the name or the city is not enough).
# A shared name in a city not listed here fails the build rather than guess.
shared:
  National Stadium:
    Karachi: { id: national-stadium }
    Hamilton: { id: bermuda-national-stadium, name: Bermuda National Stadium, country: Bermuda }
  Nehru Stadium:
    Kochi: { id: nehru-kochi }
    Guwahati: { id: nehru-stadium-guwahati }
    Margao: { id: nehru-stadium-margao }
    Pune: { id: nehru-stadium-pune }
  County Ground:
    Bristol: { id: county-ground-bristol }
    Chelmsford: { id: county-ground-chelmsford }
    Taunton: { id: county-ground-taunton }
