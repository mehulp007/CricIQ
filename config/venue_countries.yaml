# Countries for venues outside config/venues.yaml.
#
# Grounds listed in venues.yaml are curated by hand (every IPL ground is). Any
# other ground is added automatically: its name is the Cricsheet venue up to the
# first comma ("Sabina Park, Kingston, Jamaica" -> "Sabina Park"), its city is
# Cricsheet's city (else the text after the comma), and its country comes from
# `cities` below, or from `venues` for grounds whose city is missing or
# ambiguous (Hamilton is in New Zealand and Bermuda). `merges` joins names one
# ground has had, or been recorded under; `shared` splits a name several grounds
# use (Cricsheet calls grounds in Karachi and Bermuda "National Stadium"), using
# the match's city. Countries are geographic: England, Wales, Scotland and
# Northern Ireland are separate.

