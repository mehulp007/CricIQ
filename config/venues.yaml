# Canonical venues and the raw Cricsheet venue strings that map to them.
#
# A venue is a physical ground. Renames of the same ground are merged
# (Feroz Shah Kotla -> Arun Jaitley Stadium, Subrata Roy Sahara Stadium ->
# MCA Stadium Pune, Sheikh Zayed -> Zayed Cricket Stadium). Grounds that were
# rebuilt or are genuinely different stadiums stay separate (Motera vs
# Narendra Modi Stadium; PCA Mohali vs Mullanpur).
#
# The pipeline fails if a raw venue string is not listed here.

venues:
