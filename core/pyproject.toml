[project]
name = "criciq-core"
version = "0.1.0"
description = "CricIQ domain core: cricket rules, configuration and shared feature definitions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
