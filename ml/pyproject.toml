[project]
name = "criciq-ml"
version = "0.1.0"
description = "CricIQ machine learning: features, training, evaluation, inference, explainability, simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "criciq-core",
    "duckdb>=1.2",
    "lightgbm>=4.6",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=19",
    "scikit-learn>=1.6",
    "typer>=0.15",
]

[project.scripts]
criciq-ml = "criciq_ml.cli:app"

[tool.uv.sources]
criciq-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
