[project]
name = "criciq-ml"
version = "0.1.0"
description = "CricIQ machine learning: features, training, evaluation, inference, explainability, simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "criciq-core",
]

[tool.uv.sources]
criciq-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
